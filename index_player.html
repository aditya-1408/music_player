<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="stylesheet" href="style_music.css">
    <script src="https://kit.fontawesome.com/2220c21730.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <div class="music-player">
        <nav>
            <div class="circle">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
             <div class="circle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
        <img src="images/snow.png" class="song-img" alt="">
        <h1>Despacito</h1>
        <p>Luis Fonsi</p>
        <audio  controls ><source src="media/GO-Neffex.mp3" type="audio/mpeg"></audio>
        <input type="range" value="0" id="progress">
        <div class="controls">
            <i class="fa-solid fa-backward-step"></i>
            <div class="play">
                <i class="fa-solid fa-play"></i>
            </div>
            <i class="fa-solid fa-forward-step"></i>
            
        </div>
    </div>
  </div>
    <script src="script.js"></script>
</body>
</html>
