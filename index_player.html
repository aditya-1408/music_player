<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Music Player</title>
    <link rel="stylesheet" href="style_music.css" />
    <script
      src="https://kit.fontawesome.com/2220c21730.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="music-player">
        <nav>
          <div class="circle">
            <i class="fa-solid fa-chevron-left"></i>
          </div>
          <div class="circle">
            <i class="fa-solid fa-bars"></i>
          </div>
        </nav>
        <img
          src="images/Yeh-Jawaani-Hai-Deewani-2013-500x500.jpg"
          class="song-img"
          alt=""
        />
        <h1 class="song-name">Balam Pichkari</h1>
        <p>Pritam</p>
        <audio id="audio">
          <source
            src="audio/Balam Pichkari - Yeh Jawaani Hai Deewani (128 kbps).mp3"
            type="audio/mpeg"
          />
        </audio>
        <input type="range" value="0" id="progress" />
        <div class="controls">
          <button id="prev">
            <i class="fa-solid fa-backward-step"></i>
          </button>

          <button class="play" id="play">
            <i class="fa-solid fa-play"></i>
          </button>

          <button id="next">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
